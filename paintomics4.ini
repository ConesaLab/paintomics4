[uwsgi]
wsgi-file = /home/tian/paintomics/paintomics4/paintomics.wsgi

master = true
processes = 1
threads = 4
harakiri = 300
socket-timeout = 300
http-timeout = 300

# Prevent threading/forking deadlocks with APScheduler and background jobs
lazy-apps = true
# Increase socket backlog to handle connection bursts
listen = 500

socket = /tmp/paintomics.sock
logto = /home/tian/paintomics/paintomics_log/uwsgi.log
chmod-socket = 666
vacuum = true

die-on-term = true

# SendGrid API Key for email functionality
# Loaded from secure environment file (not committed to git)
env-file = /etc/paintomics/paintomics.env
