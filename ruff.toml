# Lint gate run by .github/workflows/pr.yml (ruff check .).
#
# The rule set: E9 (code that cannot parse) plus the whole F family --
# undefined names, unused imports and locals, star imports, broken f-strings.
# The tree is at zero findings (quality campaign, 2026-08); every deliberate
# exception carries a `# noqa: F401 -- <reason>` on its own line, so a bare
# noqa or a new finding fails this gate.
#
# No per-file ignores: the two the gate started with (a pasted fragment in
# AdminTools/scripts/cache.py, an undefined ROOT_DIRECTORY in AdminServlet.py)
# were removed and fixed in the dead-code/refactor phase.

target-version = "py311"
line-length = 120
extend-exclude = [
    "PaintomicsClient",
    "dist",
    "docs",
    "runs",
    # vulture INPUT, not runnable code: its bare names mark symbols as used
    # for the dead-code gate, which ruff would read as undefined names.
    "scripts/ci/vulture_whitelist.py",
]

[lint]
select = ["E9", "F"]
