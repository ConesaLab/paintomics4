# Lint gate run by .github/workflows/pr.yml (ruff check .).
#
# The rule set is the one that catches code which cannot run -- syntax errors,
# invalid escapes and comparisons, broken control flow, undefined names --
# rather than style. It is green on the tree as it stands; tightening it is a
# matter of widening `select` once the findings it would raise are fixed.
#
# No per-file ignores: the two the gate started with (a pasted fragment in
# AdminTools/scripts/cache.py, an undefined ROOT_DIRECTORY in AdminServlet.py)
# were removed and fixed in the dead-code/refactor phase.

target-version = "py311"
line-length = 120
extend-exclude = [
    "PaintomicsClient",
    "dist",
    "docs",
    "runs",
]

[lint]
select = ["E9", "F63", "F7", "F82"]
