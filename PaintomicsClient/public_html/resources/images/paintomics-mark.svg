<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="PaintOmics">
  <title>PaintOmics</title>
  <!--
    A pathway is a network, and PaintOmics paints several omics onto it. The mark
    is exactly that and nothing else: six nodes on a ring, joined.

    The previous mark said the same thing but could not be read. It was a 150px
    raster of seven saturated discs, each containing a small illustration - a DNA
    helix, a benzene ring, a cluster of molecules - joined by heavy black rules.
    At the 28px it actually renders at in the header, the illustrations became
    texture, the rules became a blot, and the whole thing read as a smudge. Detail
    that cannot be resolved at the size a mark is used is not detail, it is noise.

    So the interiors are gone, the connectors are one thin neutral stroke, and the
    only thing left carrying meaning is the colour of the six nodes. Those are not
    arbitrary: they are the application's own omic type-coding, the same hues that
    identify Gene expression, Metabolomics, Proteomics, Region-based, miRNA and
    Other omics on Step 1, in the legends and in the pathway diagrams. The mark is
    the key to the app's colour language rather than a decoration beside it.

    SVG rather than PNG so it is crisp at any size and can be recoloured in CSS.
  -->
  <g fill="none" stroke="#A6ABB2" stroke-width="1.7" stroke-linejoin="round">
    <path d="M24 9 L37 16.5 L37 31.5 L24 39 L11 31.5 L11 16.5 Z"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="24"   cy="9"    r="4.7" fill="#55C9A6"/><!-- gene expression -->
    <circle cx="37"   cy="16.5" r="4.7" fill="#79B0EC"/><!-- metabolomics    -->
    <circle cx="37"   cy="31.5" r="4.7" fill="#B4A1DD"/><!-- proteomics      -->
    <circle cx="24"   cy="39"   r="4.7" fill="#D67F6B"/><!-- other omics     -->
    <circle cx="11"   cy="31.5" r="4.7" fill="#738B9D"/><!-- region based    -->
    <circle cx="11"   cy="16.5" r="4.7" fill="#9A964E"/><!-- miRNA           -->
  </g>
</svg>
