# Dependabot configuration.
#
# The pip manifest is `/requirements.txt`, and it is the only one in the tree.
# `PaintomicsServer/src/requirements.txt` used to be a second, conflicting copy
# (CairoSVG 2.4.2 vs 2.7.0, Pillow 8.0.1 vs 10.3.0). It was first reduced to a
# bare `-r ../../requirements.txt` include and then deleted outright on
# 2026-08-11: GitHub's dependency graph cannot parse a manifest that only
# includes another one, so it kept serving the last snapshot it had managed to
# read — the 2020 pins — and raised 33 Dependabot alerts against versions
# nothing had installed for months. `PaintomicsServer/src/tests/
# test_dependencies_declared.py` now enforces that a second manifest does not
# come back, so pointing pip at "/" is enough and adding another directory here
# would recreate the problem.
#
# The pins in requirements.txt are deliberate — the comment at the top of that
# file explains which ones hold the interpreter at Python 3.11 and why. Read it
# before merging a major bump; a green PR here is not evidence that the
# scientific stack still behaves the same.
#
# `/.python-version` at the repository root is what tells dependabot the
# interpreter is 3.11. Without it dependabot resolves against the newest Python
# it knows: the first pip run under this file proposed numpy 2.5.2, which
# declares `Requires-Python >= 3.12` and so cannot install in CI at all — the
# whole group died at `pip install` before one test ran (PR #118, run
# 33437005065). That file has to stay a bare version on one line;
# dependabot-core#6650 is that a comment inside it makes the parse fall back to
# "newest".
#
# Updates are grouped so that a week produces a small number of pull requests
# rather than a dozen — but each ecosystem gets TWO groups, not one. A single
# group is only as mergeable as its worst member: #118 carried 22 bumps, 21 of
# them routine, and one impossible major held all of them. Splitting on
# update-type makes the patch/minor pull request the one that can be merged on a
# green gate, and the major one a separately reviewed decision — which is what
# the requirements.txt header asks for anyway, since it calls pandas 2.x a
# behavioural change that is "not in scope". `update-types` filters *version*
# updates only; security updates are raised from advisories and still come
# through.

version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "deps"

  # Two directories: "/" reaches .github/workflows, and the composite action has
  # to be named separately -- dependabot does not recurse into
  # .github/actions/*/action.yml, and that file pins six actions of its own. It
  # is also the file CODEOWNERS singles out as able to turn the gate green
  # without running anything, so it is the last one that should go unwatched.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-paintomics"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "ci"
