# Nightly: every example dataset through the regression harness against
# tests/baseline/. No time limit beyond the runner's own ceiling.
#
# Same environment as the PR gate (.github/actions/setup-paintomics), same
# offline rule, no secrets. Run it by hand from the Actions tab
# (workflow_dispatch) after changing anything the harness depends on.
#
# The installer-smoke job is the one deliberate exception to the offline
# rule: it downloads one small species (mge, ~59 pathways, 2 s between
# requests) from the live KEGG API, because the download path IS what it
# tests. It owns a scratch mongod on 27777 and a scratch KEGG_DATA tree.

name: Nightly regression

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: All example datasets against tests/baseline
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-paintomics
      - name: scripts/regression.sh
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci/no_network
          AI_CSIC_API_BASE: http://127.0.0.1:1/v1
          REGRESSION_WORK: ${{ runner.temp }}/regression
        run: scripts/regression.sh
      - name: Keep the differing outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/regression
          retention-days: 14
          if-no-files-found: ignore

  installer-smoke:
    name: Species installer end to end (scratch mongod, live KEGG, mge)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-paintomics
      - name: scripts/ci/installer_smoke.py
        run: >-
          python scripts/ci/installer_smoke.py
          --scratch "${{ runner.temp }}/installer-smoke"
          --seed-common "$PAINTOMICS_KEGG_DATA"
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/installer-smoke/mongod.log
          retention-days: 14
          if-no-files-found: ignore
