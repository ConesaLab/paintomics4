# Seed the Actions cache with the species-data snapshot the regression
# baseline was produced against.
#
# This is the one workflow that touches a secret: CI_DATA_DEPLOY_KEY, a
# read-only deploy key for the private repository holding the snapshot
# (KEGG-derived data may not be redistributed, so it is neither public nor in
# this repository). The PR gate and the nightly only restore the cache this
# job saves, on the default branch, which every pull request can read.
#
# Caches unused for 7 days are evicted; the nightly touches this one daily and
# the weekly schedule below re-seeds it in case it was evicted anyway. A new
# snapshot means a new key suffix here AND in .github/actions/setup-paintomics.

name: Seed the species-data cache

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read

jobs:
  seed:
    name: Fetch the snapshot and save it to the cache
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DATA_SNAPSHOT: v1-kegg20260813
    steps:
      - uses: actions/checkout@v4
      - name: Is it already cached?
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: ~/paintomics-ci/data
          key: paintomics-ci-data-${{ env.DATA_SNAPSHOT }}
          lookup-only: true
      - name: Fetch the snapshot
        if: steps.probe.outputs.cache-hit != 'true'
        env:
          CI_DATA_DEPLOY_KEY: ${{ secrets.CI_DATA_DEPLOY_KEY }}
        run: scripts/ci/fetch-data.sh ~/paintomics-ci/data
      - name: Save it
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/paintomics-ci/data
          key: paintomics-ci-data-${{ env.DATA_SNAPSHOT }}
