# Pull-request gate: lint, the unit-test sweep, and the fastest example
# dataset of each pipeline class through the regression harness.
#
# Budget: under 10 minutes wall clock. The three jobs run in parallel, so the
# wall clock is the slowest of them; each has a hard timeout below it.
#
# No secrets. The pipeline jobs restore the species-data snapshot from the
# Actions cache (seeded by data-cache.yml) and run with outbound networking
# refused (scripts/ci/no_network), so every external API -- KEGG, Reactome,
# PubMed, the LLM gateway behind AI interpretation -- is either stubbed by
# the test or fails loudly.

name: PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ruff
        run: |
          python -m pip install --quiet ruff==0.14.13
          ruff check --output-format concise .
      - name: Dead-code ratchet (vulture)
        run: |
          python -m pip install --quiet vulture==2.16
          scripts/ci/vulture_gate.sh
      - name: Shell syntax
        run: |
          for script in scripts/*.sh scripts/ci/*.sh deploy/*.sh; do
            bash -n "$script" || exit 1
          done
      # The client is the largest unguarded surface in the repository: ruff.toml
      # excludes PaintomicsClient, and no workflow mentions node or eslint, so
      # a .js file that no longer parses reached the browser. `node --check` on
      # the first-party files only -- the bundled ExtJS and vendor trees are not
      # ours to police. Measured: 80 files, 3.2 s, 0 failures today, against a
      # Lint job whose worst run is 40 s of a 300 s cap.
      - name: Client JavaScript parses
        run: |
          find PaintomicsClient -name '*.js' \
            | grep -vEi '/(lib|libs|vendor|ext-[0-9]|extjs|jquery|node_modules)/' \
            | xargs -n1 node --check
      # "Byte-compile the server" stood here. ruff selects E9 and parses every
      # file compileall did except one -- scripts/ci/vulture_whitelist.py, which
      # ruff.toml excludes because its bare names read as F821 -- so the step
      # was one file away from being pure duplication. That one file is checked
      # here instead, and the duplicate pass over the other 467 is gone.
      - name: The one file ruff does not parse
        run: python -m compileall -q scripts/ci/vulture_whitelist.py

  unit-tests:
    # Two shards: the single job crept from 7 to 10 minutes as suites were
    # added and load varied, and timed out at 8068bbba. Each shard carries
    # half the suites and the same per-suite timeout.
    name: Unit tests (offline)
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-paintomics
      - name: Test suites (shard ${{ matrix.shard }})
        # 420 s per suite, under the job's 10-minute cap with the ~110 s of
        # setup taken out. It used to be 600 s -- the whole cap -- so a hung
        # suite was killed by the JOB, and the runner never printed which suite
        # it was nor the results of the others on that shard. 420 s is 1.7x
        # the worst suite observed (249 s, test_compound_name_table_matches_mongo).
        #
        # --slowest 400 prints EVERY suite's duration, not the top 15. The
        # shard split is balanced from scripts/ci/suite_times.txt, and the only
        # honest source for that file is a CI run: a laptop mis-costs it badly
        # (the R-MORE suites cost 113 s locally and nothing here, because they
        # skip). Publishing the whole table makes refreshing it a copy.
        run: >-
          scripts/ci/run-unit-tests.sh --timeout 420 --slowest 400
          --shard "${{ matrix.shard }}"

  fixtures:
    # One dataset per pipeline class, plus one with more than one omic.
    # A field that only a multi-omic job produces is invisible to the
    # single-omic four: 5ca2b7c9 put omicName on every globalExpressionData
    # entry, passed this gate, and left the nightly failing on 02, 03, 04
    # and 08 for two days. 04-multiomics-integration is the cheapest dataset
    # that carries genes and compounds together (~100 s).
    name: Example datasets, one per pipeline class
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-paintomics
      - name: Regression against tests/baseline
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci/no_network
          AI_CSIC_API_BASE: http://127.0.0.1:1/v1
          REGRESSION_WORK: ${{ runner.temp }}/regression
        run: >-
          scripts/regression.sh
          01-gene-single-condition
          04-multiomics-integration
          05-regulatory-mirna
          06-regulatory-more
          07-region-based
      - name: Keep the differing outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/regression
          retention-days: 7
          if-no-files-found: ignore
